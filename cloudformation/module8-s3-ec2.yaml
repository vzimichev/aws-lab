AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS Lab Module 8: EC2 application from a custom AMI with an IAM role and an
  S3 bucket for image storage.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-045953348f198efe9
    Description: Custom AMI containing the FastAPI application.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the EC2 instance.

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing public subnet with a route to an Internet Gateway.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access.

  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to connect over SSH. Restrict this to your IP.

  HttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the application on port 8000.

  BucketName:
    Type: String
    Default: ''
    Description: Optional globally unique S3 bucket name. Leave empty for an autogenerated name.

  ApplicationDirectory:
    Type: String
    Default: /opt/aws-lab
    Description: Directory containing the application inside the AMI.

  ApplicationStartCommand:
    Type: String
    Default: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    Description: Command used by systemd to start the application.

  SqsQueueUrl:
    Type: String
    Default: ''
    Description: SQS queue URL from the Module 9 stack.

  SnsTopicArn:
    Type: String
    Default: ''
    Description: SNS topic ARN from the Module 9 stack.

Conditions:
  HasCustomBucketName: !Not [!Equals [!Ref BucketName, '']]

Resources:
  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasCustomBucketName, !Ref BucketName, !Ref AWS::NoValue]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListImages
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ImageBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - images
                      - images/*
              - Sid: ReadWriteImages
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${ImageBucket.Arn}/images/*'
  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to the AWS Image Lab EC2 instance.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH administration
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - Description: FastAPI application
          IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref HttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: aws-image-lab

  ImageLabInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref PublicSubnetId
          GroupSet:
            - !Ref ApplicationSecurityGroup
          AssociatePublicIpAddress: true
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euxo pipefail

            mkdir -p /etc/aws-image-lab
            cat > /etc/aws-image-lab/environment <<'EOF'
            S3_BUCKET=${ImageBucket}
            S3_PREFIX=images/
            AWS_DEFAULT_REGION=${AWS::Region}
            SQS_QUEUE_URL=${SqsQueueUrl}
            SNS_TOPIC_ARN=${SnsTopicArn}
            EOF

            cat > /etc/systemd/system/aws-image-lab.service <<'EOF'
            [Unit]
            Description=AWS Image Lab FastAPI application
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            WorkingDirectory=${ApplicationDirectory}
            EnvironmentFile=/etc/aws-image-lab/environment
            ExecStart=${ApplicationStartCommand}
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable --now aws-image-lab.service

Outputs:
  BucketName:
    Description: S3 bucket used for image storage.
    Value: !Ref ImageBucket

  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref ImageLabInstance

  InstancePublicIp:
    Description: Public IP address of the EC2 instance.
    Value: !GetAtt ImageLabInstance.PublicIp

  ApplicationUrl:
    Description: FastAPI application URL.
    Value: !Sub http://${ImageLabInstance.PublicDnsName}:8000
