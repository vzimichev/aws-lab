AWSTemplateFormatVersion: '2010-09-09'
Description: Module 10 PostgreSQL connection secret for the Data Consistency Lambda.

Parameters:
  ProjectName:
    Type: String
    Default: aws-lab

  DatabaseUrl:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Existing PostgreSQL DATABASE_URL. It is stored in Secrets Manager.

Resources:
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/rds/database-url'
      Description: PostgreSQL connection URL for the Module 10 Data Consistency Lambda.
      SecretString: !Ref DatabaseUrl
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
